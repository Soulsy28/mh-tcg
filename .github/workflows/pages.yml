name: Publier MH TCG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v6

      - name: Preparer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Tester le jeu
        run: node --test tests/*.test.cjs

      - name: Preparer le site
        run: node scripts/build.cjs

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
