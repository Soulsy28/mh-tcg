              "2af665e46f7aad275f1c6e3c5c81b653eade1217"
            ],
            [
              "tests/match.test.cjs",
              "match.test.cjs",
              "181f56bee14cf452d959b0a8b004666cc6ee73c2",
              "1565579feb8d96254e1a1cb7db56ea57a0fbf332"
            ],
            [
              "tests/peer.test.cjs",
              "peer.test.cjs",
              "23b2e928a2eb0ad2b7a0697e364638cbb62965a6",
              "2acc3e8e63b7d089d3ce85cff87614b345f5c4cb"
            ],
            [
              "tests/table.test.cjs",
              "table.test.cjs",
              "d6f9d4ffa1d50ac4bafb758fe841de3c909b15cb",
              "d7436457981fbbc8d9dbc888fc6e943a61094d68"
            ],
            [
              "tests/turn-automation.test.cjs",
              "turn-automation.test.cjs",
              "8cabee344a1835edef6610c59c33d267440839ee",
              null
            ]
          ];
          function blobSha(file) {
            if (!fs.existsSync(file)) return null;
            const bytes = fs.readFileSync(file);
            return crypto.createHash('sha1')
              .update(Buffer.from('blob ' + bytes.length + '\0'))
              .update(bytes).digest('hex');
          }
          const planned = [];
          let current = 0;
          let preserved = 0;
          for (const [target, source, expected, obsolete] of files) {
            const actual = blobSha(target);
            if (actual === expected) { current++; continue; }
            if (actual !== null && actual !== obsolete) {
              console.log('Preserved later edit: ' + target);
              preserved++;
              continue;
            }
            if (blobSha(source) !== expected) {
              throw new Error('Repair source missing or changed: ' + source + ' -> ' + target);
            }
            planned.push([target, source]);
          }
          // Validate every required source before changing any checkout file.
          for (const [target, source] of planned) {
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.copyFileSync(source, target);
            console.log('Restored: ' + target);
          }
          console.log('0.5.1 repair: ' + planned.length + ' restored, ' + current + ' already correct, ' + preserved + ' later edits preserved.');
          
          NODE

      - name: Tester le jeu
        run: node --test tests/*.test.cjs

      - name: Preparer le site
        run: node scripts/build.cjs

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
