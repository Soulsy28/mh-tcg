name: Publier MH TCG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v6

      - name: Preparer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Restaurer les chemins de la mise a jour 0.5.1
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          // One-time repair of the 0.5.1 files uploaded at the repository root.
          // Keep later edits at their proper paths, even while old root copies remain.
          const files = [
            [
              "dist/.nojekyll",
              "download",
              "34d53cdcf558e871d1f0e15a62db6ba9f73a3ba6",
              null
            ],
            [
              "dist/assets/game/ration.webp",
              "ration.webp",
              "e7379fb66a31cb09d697e678d97a7748517d2be3",
              null
            ],
            [
              "dist/assets/theme/cartography.svg",
              "cartography.svg",
              "3e94d8b20bacc59f69ef5bafa2e11363f8a75c39",
              null
            ],
            [
              "dist/assets/theme/grain.svg",
              "grain.svg",
              "9d50ce397ce9f6baa8ffaf6246b691e181dae048",
              null
            ],
            [
              "dist/engine.js",
              "engine.js",
              "cd0c09ec07cd41021ff20e377a6c648bdce22f54",
              "b4b763646a06d7db5258bb1fa6bb9154808b9439"
            ],
            [
              "dist/game-ui.js",
              "game-ui.js",
              "93694252744ed90731c1ce0a1ff5d735849d1cb9",
              "fa095e7810dc604e031d85fa7fac82afac2a9010"
            ],
            [
              "dist/i18n.js",
              "i18n.js",
              "faa97149ce1da75b997117606de1ca3b7ee54315",
              "b2c97a3cdfaee5d23b94c6dfba9a5165c884c67a"
            ],
            [
              "dist/index.html",
              "index.html",
              "b11062e070d53007aa274e36ff3bfa13226f9f59",
              "f04a3a697252f0d21574a0e0ec53e2bdde9e74e9"
            ],
            [
              "dist/match.js",
              "match.js",
              "a146df6eb5c20ad024b4d1b35c1081f98b844b05",
              "3c46d632f814628ca29992998e46453fca3186ff"
            ],
            [
              "dist/peer.js",
              "peer.js",
              "c858fafd27bc8b3a71669b019d46088332ffa5f9",
              "72c5da2f6c46e3a106dc5a0ca803194a75636bf9"
            ],
            [
